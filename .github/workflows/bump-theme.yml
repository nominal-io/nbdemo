name: Bump nominal-sphinx-theme

# Daily: moves uv.lock to the theme's newest commit and opens one PR for it, which merges itself once
# docs-gate / gate passes. Run by hand: Actions → Bump nominal-sphinx-theme → Run workflow. The
# theme's "Bump the theme in every repo" runs it too. See nominal-sphinx-theme's README, "Theme updates".

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

# the reusable workflow asks for contents: read, and a caller can't grant less; NomBot's token does
# the writes
permissions:
  contents: read

jobs:
  bump:
    uses: nominal-io/nominal-sphinx-theme/.github/workflows/bump-theme.yml@4ff295562f5c5cffa48cbc083637ed2c70304f35 # main, 2026-11-06
    secrets:
      NOMBOT_APP_ID: ${{ secrets.NOMBOT_APP_ID }}
      NOMBOT_PRIVATE_KEY: ${{ secrets.NOMBOT_PRIVATE_KEY }}
