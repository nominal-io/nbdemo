name: Build and deploy notebooks to Pages

on:
  push:
    branches: ["main"]

  pull_request:
    types: [opened, reopened, synchronize]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages,
# and to post the docs preview status on PRs
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

# Let a deployment in progress finish, but skip queued ones that a newer push replaces
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build github pages
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Check notebook code
        run: just check
      # The notebooks connect with the "default" profile. Without the NOMINAL_DOCS_KEY secret,
      # the build still succeeds, but the pages show the notebooks without outputs.
      - name: Write the Nominal profile
        env:
          NOMINAL_API_KEY: ${{ secrets.NOMINAL_DOCS_KEY }}
          NOMINAL_BASE_URL: ${{ vars.NOMINAL_BASE_URL }}
          NOMINAL_WORKSPACE_RID: ${{ vars.NOMINAL_WORKSPACE_RID }}
        run: |
          if [ -z "$NOMINAL_API_KEY" ]; then
            echo "::warning::No NOMINAL_DOCS_KEY secret, so the notebooks aren't run and publish without outputs."
            exit 0
          fi
          uv run python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          profile = {"base_url": os.environ["NOMINAL_BASE_URL"], "token": os.environ["NOMINAL_API_KEY"]}
          if os.environ["NOMINAL_WORKSPACE_RID"]:
              profile["workspace_rid"] = os.environ["NOMINAL_WORKSPACE_RID"]
          path = Path("~/.config/nominal/config.yml").expanduser()
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(yaml.safe_dump({"version": 2, "profiles": {"default": profile}}))
          path.chmod(0o600)
          PY
      # Keep executed notebooks between builds, so only notebooks whose code changed run again
      # and create resources in Nominal.
      - name: Restore notebook execution cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _build/.jupyter_cache
          # A cache key can't be overwritten, so each run saves under its own key and restores the latest.
          key: jupyter-cache-${{ hashFiles('notebooks/**/*.md', 'uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jupyter-cache-${{ hashFiles('notebooks/**/*.md', 'uv.lock') }}-
            jupyter-cache-
      - name: Build site (warnings fail the build)
        run: just build-docs
      # Uploads the site as the PR's docs-site artifact, which the renderdoc Worker serves,
      # and links the preview, or the failed run, as the "docs preview" commit status
      - name: "Built docs: upload and preview"
        if: always() && github.event_name == 'pull_request'
        uses: nominal-io/nominal-sphinx-theme/.github/actions/docs-preview@b02f35accc2914ea5603256d1ae45b76ff342b9c # main, 2026-11-06
        with:
          path: ./_build/html
          job-status: ${{ job.status }}
      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_build/html
          # The docs hub (dev.nominal.io/demos/) downloads this upload, so keep it 90 days.
          retention-days: 90

  # The check main's ruleset requires: a theme bump PR (bump-theme.yml) needs a passing docs build,
  # and every other PR passes, whatever the build did. See nominal-sphinx-theme's README, "Docs gate".
  docs-gate:
    needs: build
    if: always()
    uses: nominal-io/nominal-sphinx-theme/.github/workflows/docs-gate.yml@b02f35accc2914ea5603256d1ae45b76ff342b9c # main, 2026-11-06
    with:
      docs-result: ${{ needs.build.result }}

  deploy:
    name: Deploy github pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: depot-ubuntu-24.04-small
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
