[project]
name = "nominal-samples"
version = "0.1.0"
description = "Sample datasets for Nominal's open-source projects, fetched on demand"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
# The core has no dependencies. Loaders import their libraries on first use; install the extras for them.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
wfdb = ["wfdb>=4.1", "pandas>=2.0"]
sigmf = ["sigmf>=1.2"]
med = ["nominal-samples[pandas,wfdb]"]
rf = ["nominal-samples[sigmf]"]
aero = ["nominal-samples[pandas]"]
all = ["nominal-samples[med,rf,aero]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nominal_samples"]
# Fetched files are not in the repo; everything else under the package ships.
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pytest>=8.3.2,<9",
    "ruff==0.12.1",
    "sigmf>=1.2",
    "wfdb>=4.1",
]
# Generators in gen/
gen = ["numpy>=1.26", "pandas>=2.0"]
# Sphinx 9 needs Python >=3.12
docs = [
    "sphinx>=9.1.0; python_version >= '3.12'",
    "nominal-sphinx-theme; python_version >= '3.12'",
    "myst-nb>=1.3.0; python_version >= '3.12'",
    "ipykernel>=6.29; python_version >= '3.12'",
    "plotly>=6.0; python_version >= '3.12'",
    "nbformat>=5.10; python_version >= '3.12'",
    "pandas>=2.0; python_version >= '3.12'",
    "wfdb>=4.1; python_version >= '3.12'",
    "sigmf>=1.2; python_version >= '3.12'",
    "sphinx-copybutton>=0.5.2; python_version >= '3.12'",
    "sphinx-codeautolink>=0.17; python_version >= '3.12'",
    "sphinx-design>=0.7.0; python_version >= '3.12'",
    "sphinx-autobuild>=2025.8.25; python_version >= '3.12'",
]
notebook = [
    "jupyterlab>=4.4,<4.6",
    "jupytext>=1.17",
    "jupyterlab-myst>=2.4",
    "ipykernel>=6.29",
    "plotly>=6.0",
    "nbformat>=5.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
nominal-sphinx-theme = { git = "https://github.com/nominal-io/nominal-sphinx-theme" }

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "gen/*.py", "scripts/*.py", "docs/conf.py"]

[tool.ruff.lint]
select = ["F", "E", "W", "D", "I"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
packages = ["nominal_samples"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["wfdb.*", "sigmf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads real files; run with `-m network`"]
addopts = "-m 'not network'"
